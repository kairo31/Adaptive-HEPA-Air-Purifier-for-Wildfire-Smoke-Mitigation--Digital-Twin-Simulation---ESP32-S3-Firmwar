; Unit utama purifier -- ESP32-S3-DevKitC-1.
; Build:  cd firmware && pio run -e esp32s3-sensors     (sensor sungguhan)
;         cd firmware && pio run -e esp32s3-sim         (mode potensiometer, mis. untuk Wokwi)
; BELUM diuji di perangkat keras / Wokwi. Pin versi platform bila perlu setelah build pertama berhasil.

[platformio]
default_envs = esp32s3-sensors

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall

[env:esp32s3-sensors]

[env:esp32s3-sim]
build_flags =
    ${env.build_flags}
    -DSIM_ANALOG=1
